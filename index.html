<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JaryqPixel</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #1f2433;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 700px;
            padding: 40px;
        }

        h1 {
            margin-bottom: 12px;
            font-size: 48px;
            font-weight: 700;
        }

        p {
            color: #cfd3dc;
            font-size: 20px;
            margin-bottom: 40px;
        }

        a.button {
            display: inline-block;
            padding: 16px 34px;
            background: #3ea64b;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 20px;
            transition: 0.2s;
        }

        a.button:hover {
            background: #348d3f;
        }

        footer {
            margin-top: 60px;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>JaryqPixel</h1>

    <p>Indie game developer.<br>
    Games available on Google Play.</p>

    <a class="button"
       href="https://play.google.com/store/apps/dev?id=5520076742458688819"
       target="_blank">
        View on Google Play
    </a>

    <footer>
        © 2026 JaryqPixel
    </footer>
</div>

</body>
</html>
